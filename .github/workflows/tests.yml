name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      the-internet:
        image: gprestes/the-internet:latest
        ports:
          - 7080:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npx prettier --check .
      - name: Wait for the application
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7080/ || true)
            if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
            sleep 5
          done
          echo "the application did not become ready"; exit 1
      - uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
        env:
          BASE_URL: http://localhost:7080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 14
      - name: Build a report page
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p report
          {
            echo "<!doctype html><meta charset=utf-8><title>Cypress run</title>"
            echo "<h1>Cypress run</h1>"
            echo "<p>Commit ${GITHUB_SHA}. Run ${GITHUB_RUN_NUMBER}.</p>"
            echo "<p>Specs in this suite:</p><ul>"
            for f in cypress/e2e/*.cy.js; do echo "<li>$(basename "$f")</li>"; done
            echo "</ul>"
          } > report/index.html
      - name: Publish the report
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          force_orphan: true
